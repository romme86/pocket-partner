name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pocket
          POSTGRES_PASSWORD: pocket-local-only
          POSTGRES_DB: pocket_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pocket -d pocket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pocket:pocket-local-only@127.0.0.1:5432/pocket_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
